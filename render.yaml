services:
  - type: web
    name: nova-plus-btp
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data/nova
      - key: NOVA_ADMIN_ID
        value: admin
      - key: NOVA_ADMIN_PASSWORD
        sync: false
      - key: NOVA_ADMIN_NAME
        value: Administrateur Nova+
      - key: NOVA_SESSION_SECRET
        sync: false
    disk:
      name: nova-data
      mountPath: /var/data
      sizeGB: 5
